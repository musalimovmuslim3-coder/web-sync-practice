<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .gallery {
            padding: 60px 8%;
        }

        .gallery-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .gallery-title h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .gallery-title p {
            color: #777;
            font-size: 16px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .gallery-item {
            position: relative;
            height: 260px;
            overflow: hidden;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 5px 20px #00000015;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            padding: 25px;
            color: white;
            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.8)
            );
            opacity: 0;
            transition: 0.4s;
        }

        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }

        .gallery-overlay h3 {
            font-size: 22px;
        }

        @media (max-width: 900px) {
            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .gallery {
                padding: 40px 5%;
            }

            .gallery-container {
                grid-template-columns: 1fr;
            }

            .gallery-item {
                height: 240px;
            }

            .gallery-title h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<section class="gallery" id="gallery">

    <div class="gallery-title">
        <h1>Біздің галерея</h1>
        <p>Ең әдемі сәттер мен суреттер жинағы</p>
    </div>

    <div class="gallery-container">

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=700"
                 alt="Мейрамхана интерьері">
            <div class="gallery-overlay">
                <h3>Интерьер</h3>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=700"
                 alt="Кофе">
            <div class="gallery-overlay">
                <h3>Кофе</h3>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=700"
                 alt="Кофе дайындау">
            <div class="gallery-overlay">
                <h3>Кофе дайындау</h3>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=700"
                 alt="Кафе">
            <div class="gallery-overlay">
                <h3>Біздің кафе</h3>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=700"
                 alt="Сүт қосылған кофе">
            <div class="gallery-overlay">
                <h3>Латте</h3>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=700"
                 alt="Кофе дәндері">
            <div class="gallery-overlay">
                <h3>Кофе дәндері</h3>
            </div>
        </div>

    </div>
</section>

</body>
</html>
